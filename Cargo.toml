[package]
name = "kiui"
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["qt_full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "8"

[build-dependencies]
cxx-qt-build = "0.9"

[profile.release]
lto = "thin"
strip = "symbols"

[workspace]
